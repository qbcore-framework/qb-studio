name: Dependency drift

on:
  schedule:
    - cron: "17 6 * * 1"
      timezone: America/Chicago
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-drift
  cancel-in-progress: false

jobs:
  check-luals:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pinned: ${{ steps.check.outputs.pinned }}
      latest: ${{ steps.check.outputs.latest }}
      release_url: ${{ steps.check.outputs.release_url }}
      outdated: ${{ steps.check.outputs.outdated }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Check pinned LuaLS release
        id: check
        run: node scripts/check-luals-current.mjs

  maintain-issue:
    needs: check-luals
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Maintain dependency issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PINNED_VERSION: ${{ needs.check-luals.outputs.pinned }}
          LATEST_VERSION: ${{ needs.check-luals.outputs.latest }}
          RELEASE_URL: ${{ needs.check-luals.outputs.release_url }}
          OUTDATED: ${{ needs.check-luals.outputs.outdated }}
        with:
          script: |
            const title = "LuaLS dependency is out of date";
            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const issue = openIssues.find((item) => !item.pull_request && item.title === title);
            const pinned = process.env.PINNED_VERSION;
            const latest = process.env.LATEST_VERSION;
            const releaseUrl = process.env.RELEASE_URL;
            const marker = `Latest upstream release: ${latest}`;

            if (process.env.OUTDATED === "true") {
              const body = [
                "The weekly native-dependency check found a newer stable LuaLS release.",
                "",
                `Pinned version: ${pinned}`,
                marker,
                `Release notes: ${releaseUrl}`,
                "",
                "Review the upstream release and license, update `scripts/luals-release.json` with the reviewed version and Windows x64 archive SHA-256, then run the full test and package gates from `DEPENDENCY_POLICY.md`.",
              ].join("\n");
              if (!issue) {
                await github.rest.issues.create({ owner, repo, title, body });
              } else if (!issue.body?.includes(marker)) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `The pinned LuaLS version ${pinned} now matches the latest stable release. Closing this automated reminder.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
            }

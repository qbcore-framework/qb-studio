name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify npm registry signatures
        run: npm audit signatures
      - name: Check repository invariants
        run: npm run check:static
      - name: Audit complete dependency graph
        run: npm run audit:dependencies
      - name: Prepare verified LuaLS bundle
        run: npm run prepare:luals
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  package:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist
      - name: Verify packaged application
        run: npm run verify:package
      - name: Upload unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qb-studio-unsigned-${{ github.sha }}
          path: release/QB-Studio-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
